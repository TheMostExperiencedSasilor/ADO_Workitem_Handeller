name: Build Windows launcher

on:
  push:
    paths:
      - 'launcher/Start-Windows.ps1'
      - 'launcher/build_launcher.ps1'
      - '.github/workflows/build-windows-launcher.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install ps2exe
        shell: pwsh
        run: Install-Module ps2exe -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Compile windowless launcher
        shell: pwsh
        run: ./launcher/build_launcher.ps1
      - name: Commit generated EXE to the branch
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add launcher/ADOWorkItemLauncher.exe
          $changes = git diff --cached --name-only
          if ($changes) {
            git commit -m 'Build Windows launcher EXE'
            git push
          }
